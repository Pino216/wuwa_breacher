<script>

// Hex ��ֵ��ԭʼ 6 �������ַ��� key??const BYTE_MAP = { '1':'1C', '5':'55', '7':'7A', 'B':'BD', 'E':'E9', 'F':'FF' };

function levenshtein(a, b) {
  const m = []; for (let i = 0; i <= a.length; i++) { m[i] = [i]; for (let j = 1; j <= b.length; j++) m[i][j] = i === 0 ? j : 0; }
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = b[j-1] === a[i-1] ? m[i-1][j-1] : Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1);
  return m[a.length][b.length];

function cleanToken(t) {
  let s = t.trim().toUpperCase();

// ====== 像素模板匹配（替�?Tesseract 矩阵识别�?=====
const TMPL_SIZE = 20; // 模板标准化尺�?

function getSequences({ bufferSize, orientation, index, used, matrix, targets }) {

function makeDraggable(el) {
  let isDragging = false, isResizing = false;
  let startX, startY, startLeft, startTop, startW, startH;
  const onDown = (e, resize) => {
    e.preventDefault(); e.stopPropagation();
    isDragging = !resize; isResizing = resize;
    const p = e.type.startsWith('touch') ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    startLeft = parseFloat(el.style.left) || 0;
    startTop = parseFloat(el.style.top) || 0;
    startW = parseFloat(el.style.width) || 100;
    startH = parseFloat(el.style.height) || 80;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  };
  const onMove = e => {
    e.preventDefault();
    const p = e.type.startsWith('touch') ? e.touches[0] : e;
    const dx = (p.clientX - startX), dy = (p.clientY - startY);
    if (isDragging) {
      let l = startLeft + dx, t = startTop + dy;
      l = Math.max(0, Math.min(l, imgWrap.clientWidth - startW));
      t = Math.max(0, Math.min(t, imgWrap.clientHeight - startH));

      let w = startW + dx, h = startH + dy;

      el.style.width = w + 'px'; el.style.height = h + 'px';
    }
  };
  const onUp = () => {
    isDragging = false; isResizing = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };
  el.addEventListener('mousedown', e => onDown(e, false));
  el.addEventListener('touchstart', e => onDown(e, false), { passive: false });
  const handle = el.querySelector('.resize-handle');
  if (handle) {
    handle.addEventListener('mousedown', e => onDown(e, true));
    handle.addEventListener('touchstart', e => onDown(e, true), { passive: false });
  }
}

    rawMatrixText.textContent = data.rawMatrixText || '(����??';
    rawTargetsText.textContent = data.rawTargetsText || '(����??';
  } else {
    debugSection.style.display = 'none';
  }
  // ����
  grid.style.gridTemplateColumns = 'repeat(' + (data.hexMatrix[0]?.length || 4) + ', 64px)';
  grid.innerHTML = '';
  const stepMap = {};
  for (const s of data.steps) stepMap[s.row + ',' + s.col] = s;
  // ����ÿ�����ӵ��¸����ӵķ���
  const nextDirMap = {};
  for (let i = 0; i < data.steps.length - 1; i++) {
    const cur = data.steps[i], next = data.steps[i + 1];
    let dir = '';
    if (next.row === cur.row && next.col > cur.col) dir = '??;
    else if (next.row === cur.row && next.col < cur.col) dir = '??;
    else if (next.col === cur.col && next.row > cur.row) dir = '??;
    else if (next.col === cur.col && next.row < cur.row) dir = '??;
    nextDirMap[cur.row + ',' + cur.col] = dir;
  }
  if (data.steps.length > 0) {
    const last = data.steps[data.steps.length - 1];
    nextDirMap[last.row + ',' + last.col] = '??;
  }
  for (let r = 0; r < data.hexMatrix.length; r++) {
    for (let c = 0; c < data.hexMatrix[r].length; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const step = stepMap[r + ',' + c];
      if (step) {
        // ·������ʾ��Ų�����?+ �����ͷ��hex ֵ��С����ʾ�ڵ�??        cell.classList.add('step-highlight');
        const stepNum = document.createElement('div');
        stepNum.className = 'step-num';
        stepNum.textContent = step.step;
        cell.appendChild(stepNum);
        const nd = nextDirMap[r + ',' + c];
        if (nd) {
          const arrow = document.createElement('div');
          arrow.className = 'dir-arrow' + (nd === '?? ? ' end' : '');
          arrow.textContent = nd;
          cell.appendChild(arrow);
        }
        // С�� hex ֵ���ɱ༭��
        const hexSmall = document.createElement('div');
        hexSmall.className = 'hex-small';
        hexSmall.contentEditable = true;
        hexSmall.textContent = data.hexMatrix[r][c] || '??';
        cell.appendChild(hexSmall);
      } else {
        cell.contentEditable = true;
        cell.textContent = data.hexMatrix[r][c] || '??';
      }
      grid.appendChild(cell);
    }
  }
  // Ŀ�����У��ɱ༭??  targetsEl.innerHTML = '';
  for (let i = 0; i < data.hexTargets.length; i++) {
    const item = document.createElement('div');
    item.className = 'target-item';
    if (data.matchedTargets.includes(i)) item.classList.add('matched');
    item.innerHTML = 'Ŀ��' + (i+1) + ': <strong class="target-val" contenteditable>' + data.hexTargets[i].join(' ') + '</strong>' +
      '<span class="status ' + (data.matchedTargets.includes(i) ? 'ok' : 'fail') + '">' + (data.matchedTargets.includes(i) ? '?? : '??) + '</span>';
    targetsEl.appendChild(item);
  }
  // ����
  stepsList.innerHTML = '';
  if (data.solved && data.steps.length) {
    for (const s of data.steps) {
      const chip = document.createElement('div');
      chip.className = 'step-chip';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = s.step;
      chip.appendChild(num);
      const dirSymbol = { 'right':'??, 'left':'??, 'down':'??, 'up':'??, '':'' }[s.dir] || '';
      chip.appendChild(document.createTextNode(dirSymbol + ' (' + (s.row+1) + ',' + (s.col+1) + ') [' + s.value + ']'));
      stepsList.appendChild(chip);
    }
  } else {
    stepsList.innerHTML = '<div style="color:#f44">δ�ҵ���ƥ������Ŀ���·��?/div>';
  }
  // �ڽ�ͼ�ϱ�ע·��
  annotateImage(data);
}
// ====== �ڽ�ͼ�����ϵ��ӱ�ע·�� ======
function annotateImage(data) {
  const canvas = document.getElementById('annoCanvas');
  if (!data.solved || !data.steps.length) { canvas.style.display = 'none'; return; }
  const crop = getRect(matrixRect);
  const rows = data.hexMatrix.length;
  const cols = data.hexMatrix[0].length;
  const cellW = crop.w / cols;
  const cellH = crop.h / rows;
  // ���� canvas �ߴ�Ϊԭʼͼ��ֱ��ʣ�CSS ����ƥ����ʾ??  canvas.width = imgNaturalW;
  canvas.height = imgNaturalH;
  const ctx = canvas.getContext('2d');
  // �������ߣ��ӵ�һ���������ڶ�����ָ����һ�����ߣ�
  for (let i = 0; i < data.steps.length - 1; i++) {
    const s = data.steps[i], ns = data.steps[i + 1];
    const x1 = crop.x + s.col * cellW + cellW / 2;
    const y1 = crop.y + s.row * cellH + cellH / 2;
    const x2 = crop.x + ns.col * cellW + cellW / 2;
    const y2 = crop.y + ns.row * cellH + cellH / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = '#00ff00';
    ctx.lineWidth = 4;
    ctx.stroke();
    // ��ͷͷ����������??    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = 14;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - 0.4), y2 - headLen * Math.sin(angle - 0.4));
    ctx.lineTo(x2 - headLen * Math.cos(angle + 0.4), y2 - headLen * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fillStyle = '#00ff00';
    ctx.fill();
  }
  // ��ÿ�������Բ��?+ ���?
  for (const s of data.steps) {
    const cx = crop.x + s.col * cellW + cellW / 2;
    const cy = crop.y + s.row * cellH + cellH / 2;
    // �ⷢ??    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(0, 255, 0, 0.25)';
    ctx.fill();
    ctx.strokeStyle = '#00ff00';
    ctx.lineWidth = 3;
    ctx.stroke();
    // ���?
    ctx.fillStyle = '#00ff00';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 8;
    ctx.fillText(s.step.toString(), cx, cy);
    ctx.shadowBlur = 0;
  }
  canvas.style.display = 'block';
  // ���زü�??  matrixRect.style.display = 'none';
  targetsRect.style.display = 'none';
}
function addBadge(parent, label, value) {
  const b = document.createElement('div');
  b.className = 'badge';
  b.innerHTML = '<strong>' + label + '</strong>' + (value ? ' ' + value : '');
  parent.appendChild(b);
}
function showLoading(text) { loading.style.display = 'block'; loadingText.textContent = text || '����ʶ��...'; }
function hideLoading() { loading.style.display = 'none'; }
function showError(msg) { errorArea.textContent = msg; errorArea.style.display = 'block'; resultDiv.style.display = 'block'; document.getElementById('annoCanvas').style.display = 'none'; matrixRect.style.display = ''; targetsRect.style.display = ''; }
restartBtn.addEventListener('click', resetAll);
function resetAll() {
  currentImage = null;
  dropzone.style.display = 'block';
  cropArea.style.display = 'none';
  loading.style.display = 'none';
  resultDiv.style.display = 'none';
  errorArea.style.display = 'none';
  document.getElementById('annoCanvas').style.display = 'none';
  matrixRect.style.display = '';
  targetsRect.style.display = '';
  resolveBtn.style.display = 'none';
  lastResult = null;
}
// 保存模板

// 保存模板
saveTemplatesBtn.addEventListener('click', () => {
  if (!lastResult || !lastResult.matrixProc) return;
  const kv = [];
  const rows = lastResult.hexMatrix.length, cols = lastResult.hexMatrix[0].length;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      kv.push(lastResult.hexMatrix[r][c]);
  TemplateDB.saveAll(kv, lastResult.matrixProc);
  templateStatus.textContent = '模板: ' + TemplateDB.size + ' 个字符';
});
clearTemplatesBtn.addEventListener('click', () => {
  if (confirm('确定清除所有模板？')) {
    TemplateDB.clear();
    templateStatus.textContent = '模板: 0 个字符';
  }
});
