<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸣潮破解协议解题器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Courier New', monospace;
  background: #0a0a0a;
  color: #0f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 { margin: 24px 0 8px; font-size: 1.4rem; letter-spacing: 3px; text-shadow: 0 0 10px #0f0; }
.subtitle { color: #0a0; font-size: 0.8rem; margin-bottom: 24px; }
.container { max-width: 860px; width: 100%; padding: 0 16px; }

/* 上传区 */
.dropzone {
  border: 2px dashed #0f0; border-radius: 8px; padding: 40px;
  text-align: center; cursor: pointer; transition: all 0.3s;
  margin-bottom: 24px; background: #0d1a0d;
}
.dropzone:hover, .dropzone.dragover { border-color: #0f0; background: #0f1f0f; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
.dropzone .hint { color: #0a0; font-size: 0.9rem; }
.dropzone .hint small { display: block; margin-top: 8px; font-size: 0.75rem; color: #070; }

/* 裁剪区 */
.crop-area { display: none; margin-bottom: 16px; }
.crop-area .img-wrap {
  position: relative; display: inline-block; width: 100%;
  border: 1px solid #0a0; border-radius: 4px; overflow: hidden;
  background: #000;
}
.crop-area .img-wrap img { display: block; width: 100%; height: auto; user-select: none; }
.crop-rect {
  position: absolute; border: 2px solid; border-radius: 3px;
  cursor: move; touch-action: none;
}
.crop-rect.matrix-rect { border-color: #0f0; background: rgba(0,255,0,0.08); }
.crop-rect.targets-rect { border-color: #0ff; background: rgba(0,255,255,0.08); }
.crop-rect .label {
  position: absolute; top: -22px; left: 0;
  font-size: 0.7rem; font-weight: bold; white-space: nowrap;
}
.crop-rect.matrix-rect .label { color: #0f0; }
.crop-rect.targets-rect .label { color: #0ff; }
.crop-rect .resize-handle {
  position: absolute; bottom: -6px; right: -6px;
  width: 14px; height: 14px; border: 2px solid;
  background: rgba(0,0,0,0.6); cursor: nwse-resize;
  border-radius: 2px;
}
.crop-rect.matrix-rect .resize-handle { border-color: #0f0; }
.crop-rect.targets-rect .resize-handle { border-color: #0ff; }
.crop-actions {
  display: flex; gap: 12px; justify-content: center; margin: 16px 0;
}
.crop-btn {
  padding: 10px 24px; border: 2px solid #0f0; border-radius: 6px;
  background: transparent; color: #0f0; font-family: inherit;
  font-size: 0.9rem; font-weight: bold; letter-spacing: 2px;
  cursor: pointer; transition: all 0.3s;
}
.crop-btn:hover { background: #0f0; color: #000; box-shadow: 0 0 16px #0f0; }
.crop-btn.auto-btn { border-color: #0a0; color: #0a0; }
.crop-btn.auto-btn:hover { background: #0a0; color: #000; }
.crop-hint { text-align: center; font-size: 0.75rem; color: #080; margin: 8px 0; }

/* 加载 */
.loading { text-align: center; padding: 32px; display: none; }
.loading .spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2px solid #0a0; border-top-color: #0f0;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-right: 12px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 结果 */
.result { display: none; }
.section-title { font-size: 1rem; margin: 20px 0 12px; border-bottom: 1px solid #0f0; padding-bottom: 4px; }
.error-msg { color: #f44; padding: 16px; background: #1a0a0a; border: 1px solid #f44; border-radius: 6px; margin-bottom: 16px; }
.grid-wrapper { display: flex; justify-content: center; margin: 16px 0; }
.grid { display: inline-grid; gap: 4px; }
.cell {
  width: 64px; height: 52px; display: flex; align-items: center; justify-content: center;
  background: #0d1a0d; border: 1px solid #0f0; border-radius: 4px;
  font-size: 1rem; font-weight: bold; color: #0f0; position: relative;
}
.cell .step-badge {
  position: absolute; top: -8px; right: -8px; width: 20px; height: 20px;
  border-radius: 50%; background: #0f0; color: #000; font-size: 0.65rem;
  font-weight: bold; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 6px #0f0;
}
.cell.step-1 { border-color: #ff0; box-shadow: 0 0 12px #ff0; }
.cell.step-1 .step-badge { background: #ff0; color: #000; }
.cell.step-2 { border-color: #0ff; box-shadow: 0 0 12px #0ff; }
.cell.step-2 .step-badge { background: #0ff; color: #000; }
.cell.step-3 { border-color: #f0f; box-shadow: 0 0 12px #f0f; }
.cell.step-3 .step-badge { background: #f0f; color: #fff; }
.cell.step-4 { border-color: #f80; box-shadow: 0 0 12px #f80; }
.cell.step-4 .step-badge { background: #f80; color: #000; }
.cell.step-5 { border-color: #8f0; box-shadow: 0 0 12px #8f0; }
.cell.step-5 .step-badge { background: #8f0; color: #000; }
.cell.step-6 { border-color: #08f; box-shadow: 0 0 12px #08f; }
.cell.step-6 .step-badge { background: #08f; color: #fff; }
.cell.step-7 { border-color: #f00; box-shadow: 0 0 12px #f00; }
.cell.step-7 .step-badge { background: #f00; color: #fff; }
.cell.step-8 { border-color: #0f0; box-shadow: 0 0 12px #0f0; }
.cell.step-8 .step-badge { background: #0f0; color: #000; }
.targets { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
.target-item { background: #0d1a0d; border: 1px solid #0f0; border-radius: 6px; padding: 8px 14px; font-size: 0.9rem; }
.target-item.matched { border-color: #0f0; background: #0a1a0a; }
.target-item .status { font-size: 0.7rem; margin-left: 8px; }
.target-item .status.ok { color: #0f0; }
.target-item .status.fail { color: #f44; }
.steps-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.step-chip { background: #0d1a0d; border: 1px solid #0f0; border-radius: 4px; padding: 6px 12px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
.step-chip .num { background: #0f0; color: #000; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.7rem; }
.info-bar { display: flex; gap: 16px; margin: 12px 0; font-size: 0.85rem; flex-wrap: wrap; }
.info-bar .badge { background: #0d1a0d; border: 1px solid #0a0; border-radius: 4px; padding: 4px 10px; }
.restart-btn {
  display: block; margin: 24px auto; padding: 10px 32px; background: transparent;
  color: #0f0; border: 2px solid #0f0; border-radius: 6px;
  font-family: inherit; font-size: 1rem; font-weight: bold; letter-spacing: 3px;
  cursor: pointer; transition: all 0.3s;
}
.restart-btn:hover { background: #0f0; color: #000; box-shadow: 0 0 16px #0f0; }
.footer { margin: 32px 0 16px; font-size: 0.7rem; color: #060; }
</style>
</head>
<body>

<h1>▌鸣潮破解协议解题器▐</h1>
<div class="subtitle">上传截图 → 框选区域 → 自动求解</div>

<div class="container">
  <div class="dropzone" id="dropzone">
    <div class="hint">
      📁 拖拽截图到此处<br>
      <small>或点击选择文件</small>
    </div>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg" style="display:none">
  </div>

  <!-- 裁剪区域 -->
  <div class="crop-area" id="cropArea">
    <div class="crop-hint">🟢 拖动绿色框选中矩阵区域  ·  🔵 拖动蓝色框选中目标序列区域</div>
    <div class="img-wrap" id="imgWrap">
      <img id="cropImg" alt="uploaded">
      <div class="crop-rect matrix-rect" id="matrixRect">
        <span class="label">[矩阵]</span>
        <div class="resize-handle"></div>
      </div>
      <div class="crop-rect targets-rect" id="targetsRect">
        <span class="label">[目标]</span>
        <div class="resize-handle"></div>
      </div>
    </div>
    <div class="crop-actions">
      <button class="crop-btn auto-btn" id="autoBtn">⚡ AUTO</button>
      <button class="crop-btn" id="solveBtn">▶ SOLVE</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <span class="spinner"></span>
    <span id="loadingText">正在识别...</span>
  </div>

  <div class="result" id="result">
    <div id="errorArea" class="error-msg" style="display:none"></div>
    <div class="section-title">▸ 矩阵</div>
    <div class="info-bar" id="infoBar"></div>
    <div class="grid-wrapper"><div class="grid" id="grid"></div></div>
    <div class="section-title">▸ 目标序列</div>
    <div class="targets" id="targets"></div>
    <div class="section-title">▸ 点击顺序</div>
    <div class="steps-list" id="stepsList"></div>

    <details id="debugSection" style="margin-top:20px;display:none">
      <summary style="color:#0a0;cursor:pointer;font-size:0.85rem">🔍 调试图（OCR 实际处理的裁剪区域）</summary>
      <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:12px">
        <div style="flex:1;min-width:200px">
          <div style="font-size:0.75rem;color:#0f0;margin-bottom:4px">矩阵区 → OCR</div>
          <img id="debugMatrix" style="width:100%;border:1px solid #0f0;border-radius:4px">
        </div>
        <div style="flex:1;min-width:200px">
          <div style="font-size:0.75rem;color:#0ff;margin-bottom:4px">目标区 → OCR</div>
          <img id="debugTargets" style="width:100%;border:1px solid #0ff;border-radius:4px">
        </div>
      </div>
    </details>

    <button id="restartBtn" class="restart-btn">RESTART</button>
  </div>
</div>

<div class="footer">Optical Breacher · 拖拽方框调整裁剪区域</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const cropArea = document.getElementById('cropArea');
const cropImg = document.getElementById('cropImg');
const imgWrap = document.getElementById('imgWrap');
const matrixRect = document.getElementById('matrixRect');
const targetsRect = document.getElementById('targetsRect');
const autoBtn = document.getElementById('autoBtn');
const solveBtn = document.getElementById('solveBtn');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const resultDiv = document.getElementById('result');
const grid = document.getElementById('grid');
const targetsEl = document.getElementById('targets');
const stepsList = document.getElementById('stepsList');
const debugSection = document.getElementById('debugSection');
const debugMatrix = document.getElementById('debugMatrix');
const debugTargets = document.getElementById('debugTargets');
const infoBar = document.getElementById('infoBar');
const errorArea = document.getElementById('errorArea');
const restartBtn = document.getElementById('restartBtn');

let currentImage = null;
let imgNaturalW = 0, imgNaturalH = 0;

// ====== 上传 ======
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
  resultDiv.style.display = 'none';
  const reader = new FileReader();
  reader.onload = e => {
    currentImage = e.target.result;
    cropImg.onload = () => {
      imgNaturalW = cropImg.naturalWidth;
      imgNaturalH = cropImg.naturalHeight;
      dropzone.style.display = 'none';
      cropArea.style.display = 'block';
      initRects();
    };
    cropImg.src = currentImage;
  };
  reader.readAsDataURL(file);
}

// ====== 裁剪矩形 ======
function initRects() {
  // 默认位置：按比例对应硬编码坐标（基于1562px宽度校准）
  const scale = imgWrap.clientWidth / 1562;
  setRect(matrixRect, 30 * scale, 45 * scale, 480 * scale, 450 * scale);
  setRect(targetsRect, 880 * scale, 45 * scale, 650 * scale, 160 * scale);
  makeDraggable(matrixRect);
  makeDraggable(targetsRect);
}

function setRect(el, x, y, w, h) {
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.width = w + 'px'; el.style.height = h + 'px';
}

function getRect(el) {
  const cw = imgWrap.clientWidth;
  const rw = imgNaturalW || 1562;
  const scale = rw / cw; // 显示坐标 → 原始图像坐标
  return {
    x: Math.round(parseFloat(el.style.left) * scale),
    y: Math.round(parseFloat(el.style.top) * scale),
    w: Math.round(parseFloat(el.style.width) * scale),
    h: Math.round(parseFloat(el.style.height) * scale),
  };
}

function makeDraggable(el) {
  let isDragging = false, isResizing = false;
  let startX, startY, startLeft, startTop, startW, startH;

  const onDown = (e, resize) => {
    e.preventDefault(); e.stopPropagation();
    isDragging = !resize; isResizing = resize;
    const p = e.type.startsWith('touch') ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    startLeft = parseFloat(el.style.left) || 0;
    startTop = parseFloat(el.style.top) || 0;
    startW = parseFloat(el.style.width) || 100;
    startH = parseFloat(el.style.height) || 80;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  };

  const onMove = e => {
    e.preventDefault();
    const p = e.type.startsWith('touch') ? e.touches[0] : e;
    const dx = (p.clientX - startX), dy = (p.clientY - startY);
    if (isDragging) {
      let l = startLeft + dx, t = startTop + dy;
      l = Math.max(0, Math.min(l, imgWrap.clientWidth - startW));
      t = Math.max(0, Math.min(t, imgWrap.clientHeight - startH));
      el.style.left = l + 'px'; el.style.top = t + 'px';
    } else if (isResizing) {
      let w = startW + dx, h = startH + dy;
      // 50px 最小尺寸限制
      w = Math.max(50, w); h = Math.max(30, h);
      el.style.width = w + 'px'; el.style.height = h + 'px';
    }
  };

  const onUp = () => {
    isDragging = false; isResizing = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };

  el.addEventListener('mousedown', e => onDown(e, false));
  el.addEventListener('touchstart', e => onDown(e, false), { passive: false });
  const handle = el.querySelector('.resize-handle');
  if (handle) {
    handle.addEventListener('mousedown', e => onDown(e, true));
    handle.addEventListener('touchstart', e => onDown(e, true), { passive: false });
  }
}

// ====== 求解 ======
async function solveWithCrops(crops) {
  if (!currentImage) return;
  showLoading('正在识别...');
  resultDiv.style.display = 'none';
  errorArea.style.display = 'none';

  try {
    const res = await fetch('/api/solve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: currentImage, crops })
    });
    const data = await res.json();
    hideLoading();
    if (data.error) { showError(data.error); return; }
    showResult(data);
  } catch(e) { hideLoading(); showError('请求失败: ' + e.message); }
}

solveBtn.addEventListener('click', () => {
  solveWithCrops({ matrix: getRect(matrixRect), targets: getRect(targetsRect) });
});

autoBtn.addEventListener('click', () => {
  solveWithCrops(); // 不传 crops → 后端使用硬编码默认值
});

function showResult(data) {
  resultDiv.style.display = 'block';
  // 信息栏
  infoBar.innerHTML = '';
  addBadge(infoBar, '矩阵', data.matrixSize);
  addBadge(infoBar, '目标', data.targets.length + ' 条');
  addBadge(infoBar, data.solved ? '&#10003; 已解' : '&#10007; 未解', '');
  
  // 调试图（显示 OCR 实际处理的裁剪区域）
  if (data.debugImages && data.debugImages.matrix) {
    debugSection.style.display = 'block';
    debugMatrix.src = data.debugImages.matrix;
    debugTargets.src = data.debugImages.targets;
  } else {
    debugSection.style.display = 'none';
  }
  
  // 矩阵
  // 矩阵
  grid.style.gridTemplateColumns = 'repeat(' + (data.hexMatrix[0]?.length || 4) + ', 64px)';
  grid.innerHTML = '';
  const stepMap = {};
  for (const s of data.steps) stepMap[s.row + ',' + s.col] = s;
  for (let r = 0; r < data.hexMatrix.length; r++) {
    for (let c = 0; c < data.hexMatrix[r].length; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const step = stepMap[r + ',' + c];
      if (step) {
        cell.classList.add('step-' + step.step);
        const badge = document.createElement('div');
        badge.className = 'step-badge'; badge.textContent = step.step;
        cell.appendChild(badge);
      }
      cell.textContent = data.hexMatrix[r][c] || '??';
      grid.appendChild(cell);
    }
  }
  // 目标序列
  targetsEl.innerHTML = '';
  for (let i = 0; i < data.hexTargets.length; i++) {
    const item = document.createElement('div');
    item.className = 'target-item';
    if (data.matchedTargets.includes(i)) item.classList.add('matched');
    item.innerHTML = '目标' + (i+1) + ': <strong>' + data.hexTargets[i].join(' ') + '</strong>' +
      '<span class="status ' + (data.matchedTargets.includes(i) ? 'ok' : 'fail') + '">' + (data.matchedTargets.includes(i) ? '✓' : '✗') + '</span>';
    targetsEl.appendChild(item);
  }
  // 步骤列表
  stepsList.innerHTML = '';
  if (data.solved && data.steps.length) {
    for (const s of data.steps) {
      const chip = document.createElement('div');
      chip.className = 'step-chip';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = s.step;
      chip.appendChild(num);
      const dirSymbol = { 'right':'→', 'left':'←', 'down':'↓', 'up':'↑', '':'' }[s.dir] || '';
      chip.appendChild(document.createTextNode(dirSymbol + ' (' + (s.row+1) + ',' + (s.col+1) + ') [' + s.value + ']'));
      stepsList.appendChild(chip);
    }
  } else {
    stepsList.innerHTML = '<div style="color:#f44">未找到能匹配所有目标的路径</div>';
  }
}

function addBadge(parent, label, value) {
  const b = document.createElement('div');
  b.className = 'badge';
  b.innerHTML = '<strong>' + label + '</strong>' + (value ? ' ' + value : '');
  parent.appendChild(b);
}
function showLoading(text) { loading.style.display = 'block'; loadingText.textContent = text || '正在识别...'; }
function hideLoading() { loading.style.display = 'none'; }
function showError(msg) { errorArea.textContent = msg; errorArea.style.display = 'block'; resultDiv.style.display = 'block'; }

restartBtn.addEventListener('click', resetAll);
function resetAll() {
  currentImage = null;
  dropzone.style.display = 'block';
  cropArea.style.display = 'none';
  loading.style.display = 'none';
  resultDiv.style.display = 'none';
  errorArea.style.display = 'none';
}
</script>
</body>
</html>
